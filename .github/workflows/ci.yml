# CI on every push, then deploy to GitHub Pages from main once CI passes
# (Prompt 1 step 8). The site is https://varadmore.me/serving-explained/.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SITE_URL: https://varadmore.me/serving-explained/

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:ks
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      # Smoke and kitchen sink in all three browsers; screenshots in Chromium.
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
