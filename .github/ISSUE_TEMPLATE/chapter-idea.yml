name: Chapter idea
description: A serving mechanism that would make a good chapter.
title: "Chapter idea: "
labels: ["chapter-idea"]
body:
  - type: markdown
    attributes:
      value: |
        A chapter explains one mechanism, cites primary sources, and adds it to the same simulated engine. See CONTRIBUTING.md, "Propose a chapter".
  - type: input
    id: mechanism
    attributes:
      label: The mechanism
      placeholder: Speculative decoding
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who it helps
      description: Who would read it, and what they could explain or predict afterward.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Papers, official docs, or source code at a commit, with sections.
    validations:
      required: true
  - type: textarea
    id: engine
    attributes:
      label: What the engine would need
      description: The change to the simulated engine, for example a new scheduling policy or cost term.
    validations:
      required: true
